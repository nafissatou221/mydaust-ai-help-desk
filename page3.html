<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admission Form</title>
    <link rel="stylesheet" href="style3.css">
</head>
<body>
    <div class="container">
        <header>
         <div class="logo">
            <a href="page0.html"><img src="image.png" alt="University Logo">
            </a>
         </div>
         <nav>
            <ul>
                <li><a href="page2.html">Code of Conduct</a></li>
                <li><a href="page1.html">Bus Schedule</a></li>
                <li><a href="page3.html" class="active">Admission</a></li>
            </ul>
        </nav>
        </header>

        <div class="form-container">
            <form action="save_code.php" method="POST">
                <label for="general information">💡 General Information:</label>
                <input type="text" id="GeneralInformation" name= "General_Information" required>

                <label for="dob">📅 Academic Year:</label>
                <select id="year" name="Academic_Year">
                    <option value="2025">2025</option>
                    <option value="2026">2026</option>
                    <option value="2027">2027</option>
                    <option value="2028">2028</option>
                    <option value="2029">2029</option>
                    <option value="2030">2030</option>
                </select>
                

                <label for="program">🎓 Program:</label>
                <select id="program" name="Program">
                    <option value="computer_science">Computer Science</option>
                    <option value="mechanical_engineering">Mechanical Engineering</option>
                    <option value="electrical_engineering">Electrical Engineering</option>
                    <option value="program_2+2_nebraska">Program 2+2 Nebraska</option>
                </select>

                <label for="requirement">📋 Requirement</label>
                <textarea id="requirement" name="Details" placeholder="Enter details here..."></textarea>

                <button type="submit">Submit</button>
            </form>
        </div>
    </div>
